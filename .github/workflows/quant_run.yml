name: Quant Engine Automation

on:
  schedule:
    - cron: '0 2 * * *' # 2:00 AM UTC = 5:00 AM EAT
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force Run (Bypass 5:00 AM EAT lock & Rescrape)'
        required: false
        type: boolean
        default: false

concurrency: 
  group: engine
  cancel-in-progress: true

jobs:
  run-quant-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Quant Engine
        env:
          TRACKER_TELEGRAM_TOKEN: ${{ secrets.TRACKER_TELEGRAM_TOKEN }}
          TRACKER_TELEGRAM_CHAT_ID: ${{ secrets.TRACKER_TELEGRAM_CHAT_ID }}
          QUANT_TELEGRAM_TOKEN: ${{ secrets.QUANT_TELEGRAM_TOKEN }}
          QUANT_TELEGRAM_CHAT_ID: ${{ secrets.QUANT_TELEGRAM_CHAT_ID }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_RUN: ${{ inputs.force_run }}
        run: python quant_engine.py

      - name: Commit Memory File Back to GitHub
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Titan Automator"
          git add pending_tickets.json || true
          git commit -m "Auto-update memory notebook with today's matches" || echo "No new matches to save"
          git pull --rebase origin main || true
          git push origin main || true
